name: build test artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux test build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: cargo build --release --locked -p nico-karaoke-desktop
      - name: Stage artifact
        run: |
          mkdir -p dist/NicoKaraoke-linux-x86_64/web
          cp target/release/nico-karaoke-desktop dist/NicoKaraoke-linux-x86_64/
          cp -R web/dist/. dist/NicoKaraoke-linux-x86_64/web/
          cp README.md LICENSE NOTICE dist/NicoKaraoke-linux-x86_64/
          (cd dist && tar -czf NicoKaraoke-linux-x86_64.tar.gz NicoKaraoke-linux-x86_64)
      - uses: actions/upload-artifact@v4
        with:
          name: NicoKaraoke-linux-x86_64
          path: dist/NicoKaraoke-linux-x86_64.tar.gz
          retention-days: 7

  windows:
    name: Windows test build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: cargo build --release --locked -p nico-karaoke-desktop
      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/NicoKaraoke-windows-x86_64/web | Out-Null
          Copy-Item target/release/nico-karaoke-desktop.exe dist/NicoKaraoke-windows-x86_64/
          Copy-Item -Path web/dist/* -Destination dist/NicoKaraoke-windows-x86_64/web/ -Recurse -Force
          Copy-Item -Path README.md, LICENSE, NOTICE -Destination dist/NicoKaraoke-windows-x86_64/
      - uses: actions/upload-artifact@v4
        with:
          name: NicoKaraoke-windows-x86_64
          path: dist/NicoKaraoke-windows-x86_64
          retention-days: 7
