name: build test artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux test build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            librsvg2-dev
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - name: Build AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "::error::missing TAURI_SIGNING_PRIVATE_KEY repository secret"
            exit 1
          }
          npx tauri build --bundles appimage
      - name: Stage artifact
        run: |
          mkdir -p dist
          appimage=$(find target -type f -path "*/release/bundle/appimage/*.AppImage" | head -n1)
          test -n "$appimage" || { echo "::error::AppImage was not produced"; exit 1; }
          cp "$appimage" dist/NicoKaraoke-linux-x86_64.AppImage
          cp "$appimage.sig" dist/NicoKaraoke-linux-x86_64.AppImage.sig
      - uses: actions/upload-artifact@v7
        with:
          name: NicoKaraoke-linux-x86_64
          path: dist/*
          retention-days: 7

  windows:
    name: Windows test build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - name: Build NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Error "::error::missing TAURI_SIGNING_PRIVATE_KEY repository secret"
            exit 1
          }
          npx tauri build --bundles nsis
      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $setup = Get-ChildItem -Path target -Recurse -Filter "*-setup.exe" |
            Where-Object { $_.FullName -match "bundle\\nsis" } |
            Select-Object -First 1
          if (-not $setup) {
            Write-Error "::error::NSIS installer was not produced"
            exit 1
          }
          Copy-Item $setup.FullName "dist/NicoKaraoke-windows-x86_64-setup.exe"
          Copy-Item "$($setup.FullName).sig" "dist/NicoKaraoke-windows-x86_64-setup.exe.sig"
      - uses: actions/upload-artifact@v7
        with:
          name: NicoKaraoke-windows-x86_64
          path: dist/*
          retention-days: 7
